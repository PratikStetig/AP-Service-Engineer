<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample HTML with Dynamic Content</title>
</head>
<body>
<h1>Hello, <span th:text="${name}">[Name]</span>!</h1>
<p>Welcome to our page! The current time is <span th:text="${currentTime}">[Current Time]</span>.</p>

<!-- If you want to show a list dynamically -->
<ul>
    <li th:each="item : ${items}" th:text="${item}"></li>
</ul>
</body>
</html>
