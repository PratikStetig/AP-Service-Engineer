<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thymeleaf with Spring Boot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 1rem;
        }
        .container {
            max-width: 800px;
            margin: 2rem auto;
            background: white;
            padding: 1.5rem;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .item {
            margin-bottom: 1.5rem;
        }
        .item img {
            max-width: 100%;
            border-radius: 8px;
        }
        footer {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
<header>
    <h1>Welcome to Thymeleaf Demo</h1>
</header>

<div class="container">
    <div class="item" th:each="item : ${items}">
        <h2 th:text="${item.title}">Sample Title</h2>
        <img th:src="@{${item.image}}" alt="Image" />
        <p th:text="${item.description}">Sample Description</p>
    </div>
</div>

<footer>
    <p>&copy; 2025 Thymeleaf Demo. All Rights Reserved.</p>
</footer>
</body>
</html>
